<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're on the list · Play Away Maison</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F4A3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Yeseva+One&display=swap">
<style>
:root{--dune:#F3E9DC;--apricot:#E8A76A;--palm:#2F4A3C;--espresso:#2B211C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--palm);color:var(--dune);font:300 16px/1.65 "Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 20px}
.logo{display:inline-flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--dune);margin-bottom:56px}
.logo b{font:400 18px "Yeseva One",Georgia,serif;letter-spacing:.12em}
.logo span{font-weight:500;font-size:10px;letter-spacing:.32em}
.eyebrow{font-weight:500;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--apricot);margin:0 0 14px}
h1{font:400 clamp(40px,9vw,72px)/1.05 "Yeseva One",Georgia,serif;margin:0}
p.sub{max-width:26em;margin:20px auto 0;font-weight:400}
.actions{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 26px;border:1px solid var(--dune);color:var(--dune);font:500 12px/1 "Montserrat",sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;transition:background .3s,color .3s}
.btn:hover{background:var(--dune);color:var(--palm)}
.btn--fill{background:var(--apricot);border-color:var(--apricot);color:var(--espresso)}
.btn--fill:hover{background:var(--dune);border-color:var(--dune)}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px}
footer{padding:24px 20px;text-align:center;font-size:13px}
footer a{color:var(--dune);text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <div>
    <a class="logo" href="index.html"><b>PLAY AWAY</b><span>MAISON</span></a>
    <p class="eyebrow">Greater Palm Springs · January 28, 2027</p>
    <h1>You're on the list.</h1>
    <p class="sub">Check your inbox and confirm your email so you hear first when booking opens.</p>
    <div class="actions">
      <a class="btn btn--fill" href="https://www.instagram.com/INSTAGRAM_HANDLE" rel="noopener" target="_blank">Follow on Instagram</a>
      <a class="btn" href="index.html">Back to the site</a>
    </div>
  </div>
</main>
<footer><a href="privacy.html">Privacy policy</a></footer>

<script>
/* Sign-up conversion, fired once the pixels have loaded (see assets/pixels.js). */
window.PAM_ON_PIXELS = function(){
  var interest = new URLSearchParams(location.search).get("interest") || "unspecified";
  if (window.fbq) fbq("track", "Lead", { content_name: "waitlist", content_category: interest });
  if (window.ttq) ttq.track("CompleteRegistration", { content_name: "waitlist", content_category: interest });
};
</script>
<script src="assets/pixels.js" defer></script>
</body>
</html>
